name: ci-cd

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write # lets the job request a short-lived AWS token (OIDC); no stored AWS keys

env:
  AWS_REGION: eu-central-1

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: src/backend/requirements-dev.txt
      - name: Backend unit tests
        working-directory: src/backend
        run: |
          pip install -r requirements-dev.txt
          pytest -q
      - uses: hashicorp/setup-terraform@v3
      - name: Terraform format and validate
        working-directory: infra/terraform
        run: |
          terraform fmt -check -recursive
          terraform init -backend=false -input=false
          terraform validate
      - name: Render Kubernetes manifests
        run: |
          kubectl kustomize k8s/overlays/aws > /dev/null
          kubectl kustomize k8s/overlays/local > /dev/null

  build-and-push:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      - id: meta
        run: echo "tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
      - name: Build and push both images (tag = commit SHA, never "latest")
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          docker build -t "$REGISTRY/merck-shop/backend:$TAG" src/backend
          docker build -t "$REGISTRY/merck-shop/frontend:$TAG" frontend
          docker push "$REGISTRY/merck-shop/backend:$TAG"
          docker push "$REGISTRY/merck-shop/frontend:$TAG"
      # ECR scans every pushed image (scan_on_push in Terraform); findings appear in the ECR console.

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: production # add required reviewers in GitHub to get a manual approval gate
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: hashicorp/setup-terraform@v3
      - name: Terraform apply
        working-directory: infra/terraform
        env:
          TF_VAR_cluster_name: ${{ vars.EKS_CLUSTER_NAME }}
          TF_VAR_backend_image_tag: ${{ needs.build-and-push.outputs.tag }}
          TF_VAR_frontend_image_tag: ${{ needs.build-and-push.outputs.tag }}
        run: |
          terraform init -input=false
          terraform apply -input=false -auto-approve
      - name: Wait for the rollout
        run: |
          aws eks update-kubeconfig --name "${{ vars.EKS_CLUSTER_NAME }}" --region "$AWS_REGION"
          kubectl -n merck-shop rollout status deployment/backend --timeout=300s
          kubectl -n merck-shop rollout status deployment/frontend --timeout=300s
