apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: backend-secrets
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/instance: merck-shop
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: merck-shop
spec:
  refreshInterval: 1h # re-reads Secrets Manager, so a rotated password reaches the cluster
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: backend-secrets # the Kubernetes Secret the Deployment already references
    creationPolicy: Owner
  data:
    - secretKey: DB_PASSWORD
      remoteRef:
        key: merck-shop/dev/backend # name of the secret in AWS Secrets Manager
        property: db_password # JSON key inside that secret
